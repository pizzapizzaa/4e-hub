<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <title>4E Global · Admin</title>
  <!-- Phosphor Icons (MIT) https://phosphoricons.com -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"
          integrity="sha384-8wdMSz9CDeKWEYwhAJhGNL8g1lvh1/NoCXfmoiEqxb2cC4MoWcMPx"
          crossorigin="anonymous"></script>
  <style>
    /* ── Reset & Tokens ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:   #16A34A;
      --green-l: #DCFCE7;
      --orange:  #F97316;
      --yellow:  #FACC15;
      --bg:      #F5F7FA;
      --card:    #FFFFFF;
      --text:    #1F2937;
      --muted:   #6B7280;
      --border:  #E5E7EB;
      --sidebar: 240px;
      --topbar:  56px;
      --radius:  12px;
      --shadow:  0 2px 10px rgba(0,0,0,.07);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }

    /* ── Layout ───────────────────────────────────────────────── */
    #app { display: flex; min-height: 100dvh; }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar);
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      transition: transform .25s ease;
    }
    #sidebar-brand {
      padding: 22px 20px 18px;
      border-bottom: 1px solid var(--border);
    }
    #sidebar-brand h1 { font-size: 18px; font-weight: 800; color: var(--green); }
    #sidebar-brand p  { font-size: 11px; color: var(--muted); margin-top: 2px; }

    #sidebar nav { flex: 1; padding: 14px 10px; overflow-y: auto; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px; font-weight: 500;
      color: var(--muted);
      transition: background .15s, color .15s;
      margin-bottom: 2px;
      border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item:hover  { background: var(--bg); color: var(--text); }
    .nav-item.active { background: var(--green-l); color: var(--green); font-weight: 700; }
    .nav-item .icon  { font-size: 20px; width: 24px; text-align: center; flex-shrink: 0; display:flex; align-items:center; justify-content:center; }

    /* Main area */
    #main {
      margin-left: var(--sidebar);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Top-bar */
    #topbar {
      height: var(--topbar);
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      position: sticky; top: 0; z-index: 90;
    }
    #topbar-title { font-size: 16px; font-weight: 700; }
    #topbar-user  { font-size: 13px; color: var(--muted); }

    /* Content */
    #content { padding: 28px 24px; flex: 1; overflow: auto; }

    /* Hamburger (mobile) */
    #hamburger {
      display: none;
      background: none; border: none;
      font-size: 22px; cursor: pointer; color: var(--text);
    }

    /* Mobile bottom nav */
    #bottom-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      height: 60px;
      z-index: 200;
    }
    #bottom-nav .bnav-inner {
      display: flex; height: 100%;
      overflow-x: auto; scrollbar-width: none;
    }
    #bottom-nav .bnav-inner::-webkit-scrollbar { display: none; }
    .bnav-item {
      flex: 1; min-width: 60px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 11px; color: var(--muted); gap: 3px;
      cursor: pointer; border: none; background: none;
      transition: color .15s;
    }
    .bnav-item .icon { font-size: 22px; line-height: 1; }
    .bnav-item.active { color: var(--green); font-weight: 700; }

    /* Overlay (mobile sidebar) */
    #overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.35); z-index: 99;
    }

    /* ── Components ───────────────────────────────────────────── */

    /* Stat grid */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px 16px;
      text-align: center;
      border-top: 4px solid var(--green);
      box-shadow: var(--shadow);
    }
    .stat-card .stat-icon  { font-size: 32px; margin-bottom: 8px; line-height: 1; }
    .stat-card .stat-value { font-size: 32px; font-weight: 800; }
    .stat-card .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* Sync card */
    .sync-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .sync-card h3 { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
    .sync-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .sync-dot { width: 9px; height: 9px; border-radius: 50%; background: #22C55E; flex-shrink: 0; }
    .sync-dot.pending { background: var(--orange); }

    /* Table / list */
    .list-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 18px;
    }
    .list-header h2 { font-size: 20px; font-weight: 800; }
    .btn {
      padding: 8px 18px;
      border-radius: 8px; border: none;
      font-size: 13px; font-weight: 700;
      cursor: pointer; transition: opacity .15s, transform .06s linear, box-shadow .06s linear;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
      position: relative;
      display: inline-block;
      text-shadow: 0 1px 0 rgba(0,0,0,0.6);
    }
    .btn:hover { opacity: .95; }
    .btn-green { background: var(--green); color: #fff; }

    /* Primary / orange 3D button (face + bottom shadow + press animation) */
    .btn-orange {
      background: #FFA12B; color: #fff;
      padding: 10px 20px; border-radius: 8px; font-weight: 800;
      box-shadow: inset 0 1px 0 #FFE5C4, 0 10px 0 #915100;
      border: none;
      -webkit-user-select: none; user-select: none;
    }

    .btn-orange::after {
      content: "";
      position: absolute;
      left: -4px; right: -4px; bottom: -15px;
      height: 100%; background: #2B1800; border-radius: 6px; z-index: -1;
    }

    .btn-orange:active,
    .btn-orange.pressed {
      transform: translateY(8px);
      background: #F78900;
      box-shadow: inset 0 1px 0 #FFE5C4, inset 0 -3px 0 #915100;
    }

    .data-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .data-table th { padding: 12px 16px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); background: #FAFAFA; }
    .data-table td { padding: 13px 16px; font-size: 14px; border-bottom: 1px solid var(--border); }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tbody tr:hover { background: var(--bg); cursor: pointer; }

    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 99px;
      font-size: 11px; font-weight: 700;
    }
    .badge-green  { background: var(--green-l); color: var(--green); }
    .badge-orange { background: #FFF7ED; color: var(--orange); }
    .badge-gray   { background: #F3F4F6; color: var(--muted); }

    /* Settings */
    .method-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      display: flex; align-items: center; gap: 16px;
      border: 2px solid transparent;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      transition: border-color .15s;
    }
    .method-card.selected { border-color: var(--green); }
    .method-card .radio {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid var(--green); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .method-card .radio-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--green); display: none;
    }
    .method-card.selected .radio-dot { display: block; }
    .method-label { font-size: 15px; font-weight: 600; color: #444; }
    .method-card.selected .method-label { color: var(--green); font-weight: 700; }
    .method-desc  { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* Loader / error */
    .loader { text-align: center; padding: 60px 0; color: var(--muted); font-size: 15px; }
    .error-msg { color: #DC2626; padding: 24px; text-align: center; }

    /* Empty state */
    .empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 15px; }

    /* Toast */
    #toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #1F2937; color: #fff;
      padding: 10px 22px; border-radius: 8px; font-size: 14px;
      opacity: 0; transition: opacity .3s;
      pointer-events: none; z-index: 500;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* ── Responsive ────────────────────────────────────────────── */
    @media (max-width: 768px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      #overlay.open { display: block; }
      #main { margin-left: 0; }
      #content { padding: 20px 16px 80px; }
      #hamburger { display: block; }
      #bottom-nav { display: flex; }
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .data-table th:nth-child(n+4),
      .data-table td:nth-child(n+4) { display: none; }
    }
  </style>
</head>
<body>
  <div id="app" style="display:none">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div id="sidebar-brand">
        <h1>4E Global</h1>
        <p>Admin Console</p>
      </div>
      <nav id="sidebar-nav"></nav>
    </aside>

    <!-- Mobile overlay -->
    <div id="overlay"></div>

    <!-- Main -->
    <div id="main">
      <header id="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button id="hamburger" aria-label="Menu">&#9776;</button>
          <span id="topbar-title">Dashboard</span>
        </div>
        <span id="topbar-user">4E Admin</span>
      </header>
      <main id="content">
        <div class="loader">Loading…</div>
      </main>
    </div>

    <!-- Mobile bottom nav -->
    <nav id="bottom-nav"><div class="bnav-inner" id="bnav-inner"></div></nav>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
