<!doctype html>
<html class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alphabet Flip Cards</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Fredoka', sans-serif; }
    .flip-card { perspective: 1000px; cursor: pointer; }
    .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
    .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .flip-card-back { transform: rotateY(180deg); }
    .bounce { animation: bounce 0.5s ease; }
    @keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
    .wiggle { animation: wiggle 0.5s ease; }
    @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-5deg)} 75%{transform:rotate(5deg)} }
    .sparkle::after {
      content: '✨'; position: absolute; top: 5px; right: 8px; font-size: 16px;
      animation: twinkle 1.5s infinite;
    }
    @keyframes twinkle { 0%,100%{opacity:1} 50%{opacity:0.3} }
  </style>
  <script>
    function playLetterSound(letter, word) {
      // Use Web Speech API with cute female voice
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        
        // Speak only the word with a sweet female voice
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.rate = 0.85;
        utterance.pitch = 1.3;
        utterance.volume = 1;
        
        // Try to use a female voice
        const voices = speechSynthesis.getVoices();
        const femaleVoice = voices.find(v => v.name.includes('Female') || v.name.includes('female') || v.name.includes('woman'));
        if (femaleVoice) {
          utterance.voice = femaleVoice;
        }
        
        speechSynthesis.speak(utterance);
      }
    }
  </script>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>

   </div>
  </div>
  <script>
const alphabet = [
  {l:'A',word:'Apple',emoji:'🍎',bg:'#fecaca',color:'#dc2626'},
  {l:'B',word:'Butterfly',emoji:'🦋',bg:'#bfdbfe',color:'#2563eb'},

  {l:'J',word:'Jellyfish',emoji:'🪼',bg:'#c7d2fe',color:'#4f46e5'},

  {l:'M',word:'Moon',emoji:'🌙',bg:'#fef08a',color:'#ca8a04'},

  {l:'R',word:'Rainbow',emoji:'🌈',bg:'#fbcfe8',color:'#c026d3'},
  {l:'S',word:'Star',emoji:'⭐',bg:'#fde68a',color:'#d97706'},
  {l:'T',word:'Turtle',emoji:'🐢',bg:'#bbf7d0',color:'#15803d'},
  {l:'U',word:'Unicorn',emoji:'🦄',bg:'#f5d0fe',color:'#a21caf'},
  {l:'V',word:'Volcano',emoji:'🌋',bg:'#fecaca',color:'#dc2626'},
  {l:'W',word:'Whale',emoji:'🐳',bg:'#bfdbfe',color:'#1d4ed8'},
  {l:'X',word:'Xylophone',emoji:'🎵',bg:'#c4b5fd',color:'#6d28d9'},
  {l:'Y',word:'Yarn',emoji:'🧶',bg:'#fda4af',color:'#e11d48'},
  {l:'Z',word:'Zebra',emoji:'🦓',bg:'#e5e7eb',color:'#1f2937'}
];

const grid = document.getElementById('card-grid');

alphabet.forEach((item, i) => {
  const card = document.createElement('div');
  card.className = 'flip-card';
  card.style.height = '180px';
  card.innerHTML = `
    <div class="flip-card-inner relative w-full h-full">
      <div class="flip-card-front absolute w-full h-full rounded-2xl shadow-lg flex flex-col items-center justify-center sparkle" style="background:${item.bg}; border: 3px solid ${item.color}20;">
        <span class="text-5xl font-bold" style="color:${item.color}">${item.l}</span>
        <span class="text-2xl mt-1" style="color:${item.color}80">${item.l.toLowerCase()}</span>
      </div>
      <div class="flip-card-back absolute w-full h-full rounded-2xl shadow-lg flex flex-col items-center justify-center" style="background:${item.bg}; border: 3px solid ${item.color}40;">
        <span class="text-5xl mb-1">${item.emoji}</span>
        <span class="text-lg font-bold" style="color:${item.color}">${item.l}${item.l.toLowerCase()} - ${item.word}</span>
      </div>
    </div>`;
  card.addEventListener('click', () => {
    card.classList.toggle('flipped');
    card.classList.add('bounce');
    playLetterSound(item.l, item.word);
    setTimeout(() => card.classList.remove('bounce'), 500);
  });
  grid.appendChild(card);
});

const defaultConfig = {
  page_title: 'Learn the Alphabet! 🎉',
  primary_color: '#7c3aed',
  background_color: '#fef3c7',
  text_color: '#6b7280',
  font_family: 'Fredoka',
  font_size: 16
};

window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => {
    const title = document.getElementById('page-title');
    title.textContent = config.page_title || defaultConfig.page_title;
    title.style.color = config.primary_color || defaultConfig.primary_color;
    const font = config.font_family || defaultConfig.font_family;
    title.style.fontFamily = `${font}, Fredoka, sans-serif`;
    const size = config.font_size || defaultConfig.font_size;
    title.style.fontSize = `${size * 2.5}px`;
  },
  mapToCapabilities: (config) => ({
    recolorables: [
      { get: () => config.primary_color || defaultConfig.primary_color, set: (v) => { config.primary_color = v; window.elementSdk.setConfig({primary_color:v}); }},
      { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({text_color:v}); }}
    ],
    borderables: [],
    fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({font_family:v}); }},
    fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({font_size:v}); }}
  }),
  mapToEditPanelValues: (config) => new Map([
    ['page_title', config.page_title || defaultConfig.page_title]
  ])
});

lucide.createIcons();
  </script>
